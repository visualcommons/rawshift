# release-plz configuration — https://release-plz.dev/docs/config
#
# This workspace ships as one product: all crates share a single version
# (`version.workspace = true` in the root Cargo.toml) and are released in
# lockstep. We surface that as a single root CHANGELOG.md, a single `vX.Y.Z`
# git tag, and a single GitHub release — all owned by the `rawshift` facade.
#
# The "one crate owns the changelog, the rest fold in via `changelog_include`"
# pattern mirrors how release-plz configures its own multi-crate repository.
#
# Publish order is dependency order, which cargo resolves on its own:
#
#   rawshift-core -> rawshift-hwdec
#     -> rawshift-image-core -> the image format crates
#        (rawshift-image-{ifd,ljpeg,metadata,arw,…}) -> rawshift-image
#     -> rawshift-video-core -> rawshift-video-{symphonia,isobmff,matroska,hwdec}
#        -> rawshift-video
#     -> rawshift

[workspace]
# The lockstep defaults, applied to *every* member so a newly added crate is
# covered the moment it joins the workspace rather than silently cutting its
# own CHANGELOG.md, git tag, and GitHub release. The `rawshift` facade opts
# each one back in below; nothing else ever should.
changelog_update = false             # entries roll up into the root CHANGELOG.md
git_tag_enable = false               # only the facade creates the project tag
git_release_enable = false           # only the facade cuts the GitHub release

[[package]]
name = "rawshift"
# The facade owns the single project-wide changelog and release artifacts.
changelog_path = "./CHANGELOG.md"
changelog_include = [
    "rawshift-core",
    "rawshift-hwdec",
    "rawshift-image",
    "rawshift-image-core",
    "rawshift-image-metadata",
    "rawshift-image-ifd",
    "rawshift-image-ljpeg",
    "rawshift-image-arw",
    "rawshift-image-avif",
    "rawshift-image-cr2",
    "rawshift-image-cr3",
    "rawshift-image-crw",
    "rawshift-image-dng",
    "rawshift-image-nef",
    "rawshift-image-raf",
    "rawshift-image-heic",
    "rawshift-image-gif",
    "rawshift-image-jpeg",
    "rawshift-image-jxl",
    "rawshift-image-png",
    "rawshift-image-ppm",
    "rawshift-image-svg",
    "rawshift-image-tiff",
    "rawshift-image-webp",
]
changelog_update = true
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"      # e.g. v0.1.0 (not rawshift-v0.1.0)
git_release_name = "v{{ version }}"



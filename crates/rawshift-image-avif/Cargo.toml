[package]
name = "rawshift-image-avif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AVIF decoding for rawshift"

[dependencies]
rawshift-image-core = { workspace = true }
rawshift-image-metadata = { workspace = true, features = ["exif"] }
gamut-avif = { workspace = true }
gamut-core = { workspace = true }
gamut-isobmff = { workspace = true }
rawshift-hwdec = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = ["decode"]
decode = []
serde = ["dep:serde", "rawshift-image-core/serde"]
hw = ["dep:rawshift-hwdec", "rawshift-hwdec/hw", "rawshift-image-core/hw-planes"]
hw-videotoolbox = ["hw", "rawshift-hwdec/videotoolbox"]
hw-vaapi = ["hw", "rawshift-hwdec/vaapi"]
hw-mediacodec = ["hw", "rawshift-hwdec/mediacodec"]

[dev-dependencies]
gamut-isobmff = { workspace = true }
gamut-color = { workspace = true }

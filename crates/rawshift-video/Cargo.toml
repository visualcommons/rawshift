[package]
name = "rawshift-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Video decoding and metadata for rawshift: containers, tracks, timelines, and hardware-backed frame decode"
documentation = "https://docs.rs/rawshift-video"
keywords = ["video", "mp4", "matroska", "metadata", "decode"]
categories = ["multimedia::video"]
readme = "README.md"

[dependencies]
rawshift-core = { workspace = true }
rawshift-video-core = { workspace = true }
rawshift-video-isobmff = { workspace = true, optional = true }
rawshift-video-matroska = { workspace = true, optional = true }
rawshift-video-hwdec = { workspace = true, optional = true }

[features]
default = []

# ── Tier 1: bundles ──────────────────────────────────────────────────────────
full = ["video", "hw"]
# Every container and codec rawshift implements.
video = ["mp4", "mkv", "h264", "hevc"]

# ── Tier 2: containers ───────────────────────────────────────────────────────
# MP4 / M4V / QuickTime. One feature: they share a box grammar and a demuxer.
mp4 = ["dep:rawshift-video-isobmff"]
# Matroska / WebM.
mkv = ["dep:rawshift-video-matroska"]

# ── Tier 2: codecs ───────────────────────────────────────────────────────────
h264 = ["h264-decode"]
hevc = ["hevc-decode"]

# ── Tier 3: directions ───────────────────────────────────────────────────────
# Decode only. Encode is a finished trait seam with no implementations, so
# there is nothing for an `-encode` feature to gate yet.
h264-decode = ["dep:rawshift-video-hwdec", "rawshift-video-hwdec/h264"]
hevc-decode = ["dep:rawshift-video-hwdec", "rawshift-video-hwdec/hevc"]

# ── Tier 4: hardware backends ────────────────────────────────────────────────
# Verified flags, forwarded to rawshift-hwdec: `hw` is portable and selects the
# native backend for the target, the pinned ones fail to compile off-target.
hw = ["rawshift-video-hwdec?/hw"]
hw-vaapi = ["rawshift-video-hwdec?/hw-vaapi"]
hw-videotoolbox = ["rawshift-video-hwdec?/hw-videotoolbox"]
hw-mediacodec = ["rawshift-video-hwdec?/hw-mediacodec"]

# ── Device-oriented aliases ──────────────────────────────────────────────────
# The roadmap's names, kept so the documented surface survives now that
# container and codec are independent axes.
xavc-hs = ["mp4", "hevc-decode"] # Sony XAVC HS — HEVC in MP4
xavc-s = ["mp4", "h264-decode"]  # Sony XAVC S — H.264 in MP4

serde = ["rawshift-video-core/serde"]
